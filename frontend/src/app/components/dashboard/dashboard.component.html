<div class="container mt-4">
  <h2>Dashboard Ambiental</h2>
  
  <div *ngIf="cargando" class="text-center my-4">
    <p>Cargando datos...</p>
  </div>

  <div *ngIf="!cargando && estadisticas" class="row my-4">
    <div class="col-md-4">
      <div class="card text-white bg-primary mb-3">
        <div class="card-body">
          <h5 class="card-title">Total de Reportes</h5>
          <p class="card-text display-6">{{ estadisticas.total_reportes || 0 }}</p>
        </div>
      </div>
    </div>
  </div>

  <h3 class="mt-4">Listado de Reportes</h3>
  <div class="list-group">
    <div *ngFor="let reporte of reportes" class="list-group-item list-group-item-action">
      <div class="d-flex w-100 justify-between">
        <h5 class="mb-1">{{ reporte.titulo }}</h5>
        <small class="badge bg-secondary">{{ reporte.estado }}</small>
      </div>
      <p class="mb-1">{{ reporte.descripcion }}</p>
    </div>
  </div>
</div>
